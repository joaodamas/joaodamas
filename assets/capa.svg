<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="João Damas — gerente de projetos curioso que gosta de construir software">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9db8ff"/>
    </linearGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .fonte { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cursor { animation: pisca 1.1s steps(1) infinite; }
      @keyframes pisca { 50% { opacity: 0; } }
      .pulso { stroke-dasharray: 14 200; animation: corre 3.2s linear infinite; }
      @keyframes corre { from { stroke-dashoffset: 214; } to { stroke-dashoffset: 0; } }
      .onda { transform-origin: 930px 200px; animation: onda 3s ease-out infinite; }
      .onda2 { animation-delay: 1.5s; }
      @keyframes onda { from { transform: scale(0.6); opacity: 0.7; } to { transform: scale(1.9); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulso, .onda { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#fundo)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grade)"/>

  <!-- Texto -->
  <g class="fonte">
    <text x="72" y="104" fill="#7aa2ff" font-size="15" font-weight="600" letter-spacing="3">OLÁ, EU SOU</text>
    <text x="70" y="170" fill="url(#nome)" font-size="62" font-weight="800" letter-spacing="-1.5">João Damas</text>
    <text x="72" y="214" fill="#e6ebff" font-size="24" font-weight="500">Gerente de projetos <tspan fill="#fbbf47" font-weight="700">curioso</tspan></text>
    <text x="72" y="246" fill="#aab4d4" font-size="18">que não resiste a abrir o editor e construir o próprio software.</text>
  </g>

  <!-- Linha de terminal -->
  <g class="mono" font-size="16">
    <rect x="72" y="282" width="468" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="92" y="310" fill="#4ade80">❯</text>
    <text x="114" y="310" fill="#e6ebff">planejar() <tspan fill="#7aa2ff">&amp;&amp;</tspan> construir() <tspan fill="#7aa2ff">&amp;&amp;</tspan> entregar()</text>
    <rect class="cursor" x="514" y="296" width="9" height="19" fill="#e6ebff"/>
  </g>

  <text class="fonte" x="72" y="364" fill="#6f7aa0" font-size="14">📍 São Paulo, Brasil  ·  fundador da JP Projects</text>

  <!-- Órbita: o hub no centro, os produtos em volta -->
  <circle cx="930" cy="200" r="120" fill="url(#halo)"/>
  <g>
    <circle cx="930" cy="200" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="2 7"/>
    <animateTransform attributeName="transform" type="rotate" from="0 930 200" to="360 930 200" dur="90s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="930" cy="200" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="10 8"/>
    <animateTransform attributeName="transform" type="rotate" from="360 930 200" to="0 930 200" dur="60s" repeatCount="indefinite"/>
  </g>

  <!-- 6 produtos a cada 60°, raio 150 -->
  <g stroke-width="1" stroke="#ffffff" stroke-opacity="0.10">
    <line x1="930" y1="200" x2="930" y2="50"/>
    <line x1="930" y1="200" x2="1059.9" y2="125"/>
    <line x1="930" y1="200" x2="1059.9" y2="275"/>
    <line x1="930" y1="200" x2="930" y2="350"/>
    <line x1="930" y1="200" x2="800.1" y2="275"/>
    <line x1="930" y1="200" x2="800.1" y2="125"/>
  </g>
  <g stroke-width="2.5" stroke-linecap="round" fill="none">
    <line class="pulso" pathLength="214" stroke="#4ade80" x1="930" y1="200" x2="930" y2="50"/>
    <line class="pulso" pathLength="214" stroke="#fbbf47" x1="930" y1="200" x2="1059.9" y2="125" style="animation-delay:.55s"/>
    <line class="pulso" pathLength="214" stroke="#7aa2ff" x1="930" y1="200" x2="1059.9" y2="275" style="animation-delay:1.1s"/>
    <line class="pulso" pathLength="214" stroke="#f472b6" x1="930" y1="200" x2="930" y2="350" style="animation-delay:1.65s"/>
    <line class="pulso" pathLength="214" stroke="#b69cff" x1="930" y1="200" x2="800.1" y2="275" style="animation-delay:2.2s"/>
    <line class="pulso" pathLength="214" stroke="#38d6f0" x1="930" y1="200" x2="800.1" y2="125" style="animation-delay:2.75s"/>
  </g>

  <g class="fonte" font-size="13" font-weight="600" text-anchor="middle">
    <g transform="translate(930 50)"><circle r="20" fill="#0f1730" stroke="#4ade80" stroke-width="1.5"/><text y="5" fill="#4ade80">✂</text><text y="-28" fill="#cfd7f5">Topete</text></g>
    <g transform="translate(1059.9 125)"><circle r="20" fill="#0f1730" stroke="#fbbf47" stroke-width="1.5"/><text y="5" fill="#fbbf47">⚙</text><text x="30" y="5" text-anchor="start" fill="#cfd7f5">Fábrica</text></g>
    <g transform="translate(1059.9 275)"><circle r="20" fill="#0f1730" stroke="#7aa2ff" stroke-width="1.5"/><text y="5" fill="#7aa2ff">$</text><text x="30" y="5" text-anchor="start" fill="#cfd7f5">Finance</text></g>
    <g transform="translate(930 350)"><circle r="20" fill="#0f1730" stroke="#f472b6" stroke-width="1.5"/><text y="5" fill="#f472b6">♥</text><text y="40" fill="#cfd7f5">Fitness</text></g>
    <g transform="translate(800.1 275)"><circle r="20" fill="#0f1730" stroke="#b69cff" stroke-width="1.5"/><text y="5" fill="#b69cff">✦</text><text x="-30" y="5" text-anchor="end" fill="#cfd7f5">Ciliare</text></g>
    <g transform="translate(800.1 125)"><circle r="20" fill="#0f1730" stroke="#38d6f0" stroke-width="1.5"/><text y="5" fill="#38d6f0">◎</text><text x="-30" y="5" text-anchor="end" fill="#cfd7f5">Arena</text></g>
  </g>

  <!-- Núcleo -->
  <circle class="onda" cx="930" cy="200" r="34" fill="none" stroke="#7aa2ff" stroke-opacity="0.6"/>
  <circle class="onda onda2" cx="930" cy="200" r="34" fill="none" stroke="#7aa2ff" stroke-opacity="0.6"/>
  <circle cx="930" cy="200" r="34" fill="#16204a" stroke="#7aa2ff" stroke-width="2"/>
  <text class="fonte" x="930" y="208" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.5">JP</text>
</svg>
